[workspace]
resolver = "2"
members = ["src-tauri", "src-tauri/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "6"
tracing = "0.1"
keyring = "3"
