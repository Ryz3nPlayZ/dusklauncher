<!doctype html>
<html lang="en" data-theme="overworld">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuskLauncher</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0d0507; /* scene sky-bottom, avoids white flash */
        overflow: hidden;
      }
    </style>
    <script>
      // Linux runs WebKitGTK on its CPU renderer (see run() in lib.rs), where
      // blur costs seconds per repaint; base.css drops it under this class
      if (/Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent))
        document.documentElement.classList.add('os-linux');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
