# Dusk client mod. Nine Minecraft targets share one source tree; pick with
# `-Pmc=<target>` (default 1.21.11). Each target is built against the last
# patch of a run of API-compatible releases and its jar is declared for that
# whole run (mc_<key>_range); the launcher picks the jar by the instance's
# version (cosmetics::client_mod_jar_for). Together the jars cover every
# release from 1.21 through 26.2. mc_<key>_layers lists the src/mc* dirs
# stacked on src/main, newest first, later ones overriding (build.gradle).
org.gradle.jvmargs=-Xmx2G

mc=1.21.11

# 1.21.x targets are obfuscated (Mojang mappings, Java 21)

# 1.21, 1.21.1
mc_1_21_1_loader=0.17.3
mc_1_21_1_fabric=0.116.17+1.21.1
mc_1_21_1_range=>=1.21 <1.21.2
mc_1_21_1_layers=1.21.11,1.21.10,1.21.8,1.21.5,1.21.4,1.21.3,1.21.1
mc_1_21_1_gametest=false

# 1.21.2, 1.21.3
mc_1_21_3_loader=0.17.3
mc_1_21_3_fabric=0.114.1+1.21.3
mc_1_21_3_range=>=1.21.2 <1.21.4
mc_1_21_3_layers=1.21.11,1.21.10,1.21.8,1.21.5,1.21.4,1.21.3
mc_1_21_3_gametest=false

# 1.21.4
mc_1_21_4_loader=0.17.3
mc_1_21_4_fabric=0.119.4+1.21.4
mc_1_21_4_range=1.21.4
mc_1_21_4_layers=1.21.11,1.21.10,1.21.8,1.21.5,1.21.4

# 1.21.5
mc_1_21_5_loader=0.17.3
mc_1_21_5_fabric=0.128.2+1.21.5
mc_1_21_5_range=1.21.5
mc_1_21_5_layers=1.21.11,1.21.10,1.21.8,1.21.5

# 1.21.6, 1.21.7, 1.21.8
mc_1_21_8_loader=0.17.3
mc_1_21_8_fabric=0.136.1+1.21.8
mc_1_21_8_range=>=1.21.6 <1.21.9
mc_1_21_8_layers=1.21.11,1.21.10,1.21.8

# 1.21.9, 1.21.10
mc_1_21_10_loader=0.17.3
mc_1_21_10_fabric=0.138.4+1.21.10
mc_1_21_10_range=>=1.21.9 <1.21.11
mc_1_21_10_layers=1.21.11,1.21.10

# 1.21.11
mc_1_21_11_loader=0.17.3
mc_1_21_11_fabric=0.141.2+1.21.11
mc_1_21_11_range=1.21.11
mc_1_21_11_layers=1.21.11

# 26.x targets are unobfuscated (no mappings, Java 25)

# 26.1 / 26.1.1 / 26.1.2
mc_26_1_loader=0.19.5
mc_26_1_fabric=0.155.3+26.1.2
mc_26_1_range=~26.1
mc_26_1_layers=1.21.11,26.1

# 26.2
mc_26_2_loader=0.19.5
mc_26_2_fabric=0.161.0+26.2
mc_26_2_range=~26.2
mc_26_2_layers=1.21.11,26.2

mod_version=0.2.0
maven_group=dev.dusk
archives_base_name=duskclient
