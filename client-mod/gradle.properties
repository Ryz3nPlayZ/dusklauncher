# Dusk client mod. Two Minecraft targets share one source tree; pick with
# `-Pmc=1.21.11` (default) or `-Pmc=26.2`. See build.gradle for the
# per-target versions and docs/COSMETICS.md §5 for how the launcher uses them.
org.gradle.jvmargs=-Xmx2G

mc=1.21.11

# 1.21.11 (obfuscated; Mojang mappings, Java 21)
mc_1_21_11_loader=0.17.3
mc_1_21_11_fabric=0.141.2+1.21.11

# 26.2 (unobfuscated; no mappings, Java 25)
mc_26_2_loader=0.19.5
mc_26_2_fabric=0.161.0+26.2

mod_version=0.2.0
maven_group=dev.dusk
archives_base_name=duskclient
