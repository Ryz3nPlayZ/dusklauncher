# Client gametests for one version, without a release: run it by hand
# (gh workflow run gametest -f mc=1.21.11) or push a gametest/* branch
# (gametest/26.3 or gametest/26.3/anything tests 26.3, others 1.21.11).
# Dumps the game's threads if a world takes too long to load.
name: gametest

on:
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version
        default: '1.21.11'
  push:
    branches: ['gametest/**']

jobs:
  client-gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the version
        env:
          INPUT_MC: ${{ inputs.mc }}
        run: |
          mc="$INPUT_MC"
          if [ -z "$mc" ]; then
            mc=$(echo "$GITHUB_REF_NAME" | sed -nE 's#^gametest/([0-9]+(\.[0-9]+)+)(/.*)?$#\1#p')
          fi
          mc=${mc:-1.21.11}
          case "$mc" in 1.*) java=21 ;; *) java=25 ;; esac
          echo "MC=$mc" >> "$GITHUB_ENV"
          echo "JAVA=$java" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      # 26.3 has no GL window on Xvfb and falls back to Vulkan (lavapipe)
      - name: Virtual display + software GL and Vulkan
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Run the client gametests
        working-directory: client-mod
        # a game with no backend shows a modal error box and waits on it
        timeout-minutes: 12
        run: |
          # thread dumps of the game every 20 s once it's been up 60 s
          (sleep 60; for i in 1 2 3 4; do
             for pid in $(jps -l | awk '!/Gradle|Jps|Daemon/ {print $1}'); do
               echo "===== dump $i pid $pid"; jstack "$pid"
             done >> threads.txt 2>&1; sleep 20; done) &
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClientGameTest -Pmc=$MC --console=plain
      - name: Thread dumps
        if: always()
        working-directory: client-mod
        run: cat threads.txt 2>/dev/null || echo "no dumps"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-${{ env.MC }}
          path: |
            client-mod/threads.txt
            client-mod/build/run/clientGameTest/logs/latest.log
            client-mod/build/run/clientGameTest/crash-reports/
            client-mod/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
