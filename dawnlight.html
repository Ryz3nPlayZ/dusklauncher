const cvs = document.getElementById('scene');
const ctx = cvs.getContext('2d', { alpha: false });

/* ---- decode payload: [u16 W][u16 H] then runs of [varint len][r][g][b] --- */
const bytes = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
const img = ctx.createImageData(W, H);
const px = img.data;
let i = 4, p = 0;
while (p < W * H) {
  let len = 0, shift = 0, b;
  do { b = bytes[i++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
  const r = bytes[i], g = bytes[i + 1], bl = bytes[i + 2];
  i += 3;
  while (len--) {
    px[p * 4] = r; px[p * 4 + 1] = g; px[p * 4 + 2] = bl; px[p * 4 + 3] = 255;
    p++;
  }
}
ctx.putImageData(img, 0, 0);

/* ---- reflection mask: region boxes + shimmer color rules -----------------
   Boxes (y0,y1,x0,x1) bound the sun's reflection column on the water; within
   them, a pixel is "shimmer" if it is near-white (pink lit water) or a bright
   yellow glint. Tier grows with depth below the sun -> stronger flicker.   */
const BOXES = [[122,134,74,119],[134,144,84,105],[146,147,89,107]];
const reflect = [];
for (const [y0, y1, x0, x1] of BOXES) {
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const k = (y * W + x) * 4;
      const r = px[k], g = px[k + 1], b = px[k + 2];
      const white  = b >= 190 && r >= 230 && g >= 212;
      const yellow = r >= 246 && (r - g) >= 18;
      if (!(white || yellow)) continue;
      const tier = y <= 127 ? 0 : y <= 133 ? 1 : 2;
      reflect.push({ k, r, g, b, x, y, tier });
    }
  }
}

/* animation bbox (reflection area only) */
const BX = 70, BY = 118, BW = 54, BH = 34;
const base = new Uint8ClampedArray(BW * BH * 4);
for (let y = 0; y < BH; y++)
  for (let x = 0; x < BW; x++) {
    const s = ((y + BY) * W + (x + BX)) * 4, d = (y * BW + x) * 4;
    base[d] = px[s]; base[d+1] = px[s+1]; base[d+2] = px[s+2]; base[d+3] = 255;
  }
const frame = new ImageData(new Uint8ClampedArray(base), BW, BH);

const TIER_AMP = [0.10, 0.22, 0.42];
const PERIOD = 9;                 // seconds — seamless loop
const STEP = 1000 / 18;           // 18 fps step for a chunky pixel cadence
let last = -1;

/* glints never dim toward black: they melt into the surrounding water tone
   (half-toned lavender) so the low phase reads as "light faded into water" */
function mixDim(r, g, b) {
  return [r * 0.5 + 110, g * 0.5 + 99, b * 0.5 + 105];
}

function paintReflection(t) {
  frame.data.set(base);
  for (const s of reflect) {
    const qx = ((s.x * 7) % 13) * 0.5;       // stable per-dash phase
    const w1 = Math.sin(2*Math.PI*(2*t/PERIOD) + s.y*0.55 + s.x*0.12);
    const w2 = Math.sin(2*Math.PI*(3*t/PERIOD) - s.y*0.35 + qx);
    const w3 = Math.sin(2*Math.PI*(1*t/PERIOD) + s.x*0.35);
    const amp = TIER_AMP[s.tier];
    const f = 1 + amp * (0.55*w1 + 0.30*w2 + 0.15*w3);
    const m = Math.max(0, Math.min(f, 1.28));
    const d = ((s.y - BY) * BW + (s.x - BX)) * 4;
    if (!s.dim) s.dim = mixDim(s.r, s.g, s.b);
    frame.data[d]   = s.dim[0]   + (s.r - s.dim[0])   * m;
    frame.data[d+1] = s.dim[1]   + (s.g - s.dim[1])   * m;
    frame.data[d+2] = s.dim[2]   + (s.b - s.dim[2])   * m;
  }
  ctx.putImageData(frame, BX, BY);
}

function drawReflection(now) {
  const q = Math.floor(now / STEP);          // quantized time
  if (q !== last) {
    last = q;
    paintReflection((q % (PERIOD * 18)) / (PERIOD * 18) * PERIOD);  // loops every 9s
  }
  requestAnimationFrame(drawReflection);
}
requestAnimationFrame(drawReflection);

/* ---- integer-scale to fit the window, centered --------------------------- */
function fit() {
  const s = Math.max(1, Math.min(Math.floor(innerWidth / W), Math.floor(innerHeight / H)));
  cvs.style.width = W * s + 'px';
  cvs.style.height = H * s + 'px';
}
addEventListener('resize', fit);
fit();
</script>
